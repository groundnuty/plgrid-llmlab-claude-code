# Opus-driven hybrid: Claude Opus orchestrates, LLMLab models do the work as subagents.
#
# Claude Code has no per-agent provider routing and ANTHROPIC_BASE_URL is a single
# global, so one endpoint must serve both providers and route by model name. That
# is the only reason the Anthropic leg goes through this proxy at all.
#
# Setup, once:
#   cli-proxy-api --config <this file> --claude-login
# That runs an OAuth flow against your Claude subscription and stores a refreshable
# token in auth-dir. No API key needed, and nothing to paste into this file.
#
# THIS PROXY MUST STAY LOCAL AND SINGLE-USER.
# auth-dir holds an access_token AND a refresh_token in plaintext, and credentials
# are pooled round-robin across all logged-in accounts. On a shared host, other
# users could read the token file or have their requests served by your
# subscription. Bind to 127.0.0.1 and never run this instance for a team.
#
# Use with config/claude-settings.opus.json.
host: "127.0.0.1"
port: 8317
auth-dir: "~/.cli-proxy-api"
request-log: true
disable-cooling: true

# No impersonation. Cloaking exists to disguise non-Claude-Code clients as Claude
# Code; here the client genuinely IS Claude Code, so there is nothing to disguise
# and this stays off. Verified working with it off — Anthropic returns 200.
disable-claude-cloak-mode: true

api-keys:
  - "local-test-key"

# Anthropic models come from the OAuth credential in auth-dir (see --claude-login
# above). No claude-api-key block: this setup deliberately uses no paid API key.

openai-compatibility:
  - name: "plgrid"
    base-url: "https://llmlab.plgrid.pl/api/v1"
    api-key-entries:
      - api-key: "PLGRID_API_KEY"
    models:
      - name: "zai-org/GLM-5.2-FP8"
        alias: "glm-5.2-fp8-393k"
      - name: "Qwen/Qwen3.6-27B"
        alias: "qwen3.6-27b-262k"
      - name: "Qwen/Qwen3.6-35B-A3B"
        alias: "qwen3.6-35b-a3b-262k"
      - name: "google/gemma-4-31B"
        alias: "gemma-4-31b-262k"
      - name: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
        alias: "qwen3-coder-30b-249k"
      - name: "Qwen/Qwen3-VL-8B-Instruct"
        alias: "qwen3-vl-8b-262k"

# Applies only to the OpenAI leg; the Anthropic leg is untouched passthrough.
payload:
  filter:
    - models:
        - name: "*"
          protocol: "openai"
      params:
        - "reasoning_effort"
